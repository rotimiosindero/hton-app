<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Houghton 2026 — Timetable</title>

<!-- Standard PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#160D0A" />

<!-- iOS Safari: there is no manifest install prompt on iOS, these tags are what
     actually make "Add to Home Screen" behave like an app instead of a bookmark -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Houghton 2026" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="passgate" id="passGate">
  <form class="passgate-card" id="passGateForm">
    <h2>Houghton <span>2026</span></h2>
    <p>Enter the password to continue</p>
    <input type="password" id="passGateInput" placeholder="Password" autocomplete="off" autofocus />
    <button type="submit">Enter</button>
    <p class="passgate-error" id="passGateError" style="display:none;">Wrong password, try again</p>
  </form>
</div>

<div class="dawnbar"></div>
<header>
  <div class="titlerow">
    <h1 id="pageTitle">Houghton <span>2026</span></h1>
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="Search an act…" />
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
    </div>
  </div>
  <div class="toprow">
    <div class="tabs" id="dayTabs"></div>
  </div>
</header>

<div class="detailbar" id="detailBar">Hover or tap a set for details</div>

<div class="gridscroll" id="gridScroll">
  <div class="gridinner" id="gridInner"></div>
</div>

<div class="scheduleview" id="scheduleView">
  <div class="schedule-toggle" id="scheduleToggle">
    <button class="schedule-toggle-btn active" data-mode="list">List</button>
    <button class="schedule-toggle-btn" data-mode="timetable">Timetable</button>
  </div>
  <div id="scheduleList"></div>
  <div class="gridscroll" id="scheduleGridScroll" style="display:none;">
    <div class="gridinner" id="scheduleGridInner"></div>
  </div>
</div>

<div class="aboutview" id="aboutView">
  <div class="about-card">
    <h2>Houghton <span>2026</span></h2>
    <p>Unofficial personal build.</p>
    <p class="about-version">Version <strong id="appVersionLabel">—</strong></p>
  </div>
</div>

<div class="starmenu" id="starMenu">
  <button data-level="1">★ Must see</button>
  <button data-level="2">☆ Could see</button>
  <button data-level="3">⇄ Clash backup</button>
  <button data-level="0" class="clearbtn">Clear favourite</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
